plugins { id 'com.android.application' }

android {
    namespace 'com.rezekios.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rezekios.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Optional release signing: create keystore.properties (see README) to sign release builds.
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        def ks = new Properties(); ks.load(new FileInputStream(ksFile))
        signingConfigs {
            release {
                storeFile file(ks['storeFile']); storePassword ks['storePassword']
                keyAlias ks['keyAlias']; keyPassword ks['keyPassword']
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
